name: sumaqagro-local
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sumaqagro
      MYSQL_USER: sumaqagro
      MYSQL_PASSWORD: ${SUMAQAGRO_DB_PASSWORD:?Set SUMAQAGRO_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SUMAQAGRO_DB_ROOT_PASSWORD:?Set SUMAQAGRO_DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=sumaqagro;User ID=sumaqagro;Password=${SUMAQAGRO_DB_PASSWORD}"
      Jwt__SigningKey: ${SUMAQAGRO_JWT_KEY:?Set SUMAQAGRO_JWT_KEY}
      Subscriptions__DemoPayments__Enabled: "true"
      Certification__PublicBaseUrl: http://localhost:8080

  frontend:
    build: ../PROYECTO-WEB-FRONTEND
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mysql-data:
